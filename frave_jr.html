<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frave Jr</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{--r:#7C3AED;--rd:#6D28D9;--rl:#F5F3FF;--bg:#f3f0ff;--tx:#1a1a2e;--mu:#6b7280;--br:#e5e7eb;--sh:0 2px 16px rgba(0,0,0,.07);--ra:14px}
body{background:var(--bg);color:var(--tx);min-height:100vh}
.mc-g{animation:mcb 2.6s ease-in-out infinite}
.mc-e1{transform-origin:29px 33px;animation:mcbk 4.5s ease-in-out infinite}
.mc-e2{transform-origin:51px 33px;animation:mcbk 4.5s ease-in-out .2s infinite}
@keyframes mcb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mcbk{0%,82%,100%{transform:scaleY(1)}89%{transform:scaleY(0.05)}}
#hdr{background:var(--r);padding:0 20px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.logo{display:flex;align-items:center;gap:10px;color:#fff}
.logo-txt{font-size:1.35rem;font-weight:900;letter-spacing:-.5px}.logo-txt span{opacity:.5;font-weight:300}
.hdr-r{display:flex;align-items:center;gap:10px}
#clk{color:rgba(255,255,255,.8);font-size:.75rem}
#sbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 13px;border-radius:20px;cursor:pointer;font-size:.76rem;font-weight:700;transition:all .2s}
#sbtn:hover{background:rgba(255,255,255,.28)}#sbtn.on{background:#FFD700;color:#4a3500;border-color:#FFD700}
#nav{background:#fff;display:flex;overflow-x:auto;border-bottom:1px solid var(--br);position:sticky;top:62px;z-index:199;scrollbar-width:none;box-shadow:0 1px 8px rgba(0,0,0,.05)}
#nav::-webkit-scrollbar{display:none}
.nb{flex-shrink:0;padding:13px 15px;border:none;background:none;color:var(--mu);font-size:.79rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.nb:hover{color:var(--r)}.nb.on{color:var(--r);border-bottom-color:var(--r)}
#main{max-width:1100px;margin:0 auto;padding:20px}
.sec{display:none}.sec.on{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.sh h2{font-size:1.15rem;font-weight:900}.sh h2 em{color:var(--r);font-style:normal}
.ba{background:var(--r);color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:700;transition:background .2s}
.ba:hover{background:var(--rd)}
.bsm{background:none;border:1px solid var(--br);padding:3px 9px;border-radius:6px;cursor:pointer;font-size:.7rem;color:var(--mu);transition:all .2s}
.bsm:hover{border-color:var(--r);color:var(--r)}
.bdl{background:none;border:none;color:#ccc;cursor:pointer;font-size:.72rem;padding:2px 5px;border-radius:4px;transition:color .2s}
.bdl:hover{color:var(--r)}
.card{background:#fff;border-radius:var(--ra);padding:20px;box-shadow:var(--sh);margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.hero{background:linear-gradient(135deg,var(--r),#4c1d95);color:#fff;border-radius:var(--ra);padding:26px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:'Jr';position:absolute;right:-5px;bottom:-28px;font-size:9rem;font-weight:900;opacity:.07;line-height:1;pointer-events:none}
.hero h1{font-size:1.2rem;font-weight:900;margin-bottom:4px}.hero p{font-size:.84rem;opacity:.85}
.hdate{font-size:.73rem;opacity:.6;margin-top:5px}
.hero-icons{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.hico{font-size:1.55rem;animation:hflt 3s ease-in-out infinite;display:inline-block}
@keyframes hflt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sc{background:#fff;border-radius:var(--ra);padding:16px;box-shadow:var(--sh);border-left:4px solid var(--r)}
.sc .n{font-size:1.9rem;font-weight:900;color:var(--r);line-height:1}.sc .l{font-size:.72rem;color:var(--mu);margin-top:3px}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--r);color:#fff;padding:9px 11px;text-align:left;font-size:.73rem;font-weight:700;white-space:nowrap}
tbody td{padding:8px 11px;border-bottom:1px solid var(--br);font-size:.8rem;vertical-align:middle}
tbody tr:hover td{background:var(--rl)}
.gm{background:#fff;border-radius:var(--ra);padding:13px 15px;box-shadow:var(--sh);display:flex;align-items:center;gap:11px}
.gm .ico{font-size:1.4rem}.gm .v{font-size:1.15rem;font-weight:900;color:var(--r);line-height:1}.gm .l{font-size:.68rem;color:var(--mu);margin-top:3px}
.kpi-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ktab{padding:7px 13px;border-radius:8px;border:1.5px solid var(--br);background:#fff;font-size:.76rem;font-weight:700;color:var(--mu);cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
.ktab:hover{border-color:var(--r);color:var(--r)}.ktab.on{background:var(--r);color:#fff;border-color:var(--r)}
.kpi-day-lbl{font-size:.71rem;color:var(--mu);margin-bottom:10px;font-weight:600}
.kv{font-weight:700;color:var(--tx)}.kz{color:#d1d5db}
.nc{background:#fff;border-radius:var(--ra);padding:17px;box-shadow:var(--sh);margin-bottom:12px;border-left:4px solid var(--r);animation:sli .3s ease}
@keyframes sli{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.nhd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:12px}
.nt{font-weight:900;font-size:.89rem}.nd{font-size:.69rem;color:var(--mu);white-space:nowrap;flex-shrink:0}
.nb2{font-size:.82rem;color:#444;line-height:1.55;white-space:pre-line}
.nc-feat{border-left-width:6px;background:linear-gradient(to right,#faf5ff,#fff);box-shadow:0 4px 20px rgba(124,58,237,.13)}
.nov-hoy{background:var(--r);color:#fff;font-size:.58rem;font-weight:900;padding:2px 8px;border-radius:20px;letter-spacing:.4px;white-space:nowrap}
.ec{background:#fff;border-radius:var(--ra);padding:12px 16px;box-shadow:var(--sh);display:flex;align-items:center;gap:13px;margin-bottom:10px;transition:transform .2s}
.ec:hover{transform:translateX(4px)}
.edt{min-width:49px;height:49px;background:var(--r);color:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.edt .day{font-size:1.1rem;font-weight:900;line-height:1}.edt .mon{font-size:.55rem;font-weight:700;text-transform:uppercase;opacity:.85}
.ei h4{font-weight:800;font-size:.85rem}.ei p{font-size:.74rem;color:var(--mu);margin-top:2px}
.tc{background:#fff;border-radius:var(--ra);padding:20px 12px;box-shadow:var(--sh);text-align:center;animation:flt 3s ease-in-out infinite}
.tc:nth-child(2n){animation-delay:.4s}.tc:nth-child(3n){animation-delay:.8s}.tc:nth-child(4n){animation-delay:1.2s}.tc:nth-child(5n){animation-delay:.6s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tc:hover{animation-play-state:paused;transform:translateY(-12px) scale(1.04)!important;box-shadow:0 16px 32px rgba(0,0,0,.15);transition:transform .3s,box-shadow .3s}
.avr{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;padding:3px;background:conic-gradient(var(--r) 0%,#a78bfa 35%,#ede9fe 50%,#a78bfa 65%,var(--r) 100%);animation:spinr 4s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.avc{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;color:#fff;animation:cspinr 4s linear infinite}
@keyframes cspinr{to{transform:rotate(-360deg)}}
.tcnm{font-weight:900;font-size:.84rem}.tcrl{font-size:.7rem;color:var(--mu);margin-top:2px}
.tc-bday{font-size:.63rem;color:var(--r);font-weight:700;margin-top:4px}
.supbar{background:#f3e8ff;border:1px solid #c4b5fd;border-radius:8px;padding:7px 14px;font-size:.75rem;color:#4c1d95;font-weight:700;margin-bottom:14px}

#mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
#mov.on{display:flex}
#mbox{background:#fff;border-radius:var(--ra);padding:24px;width:92%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:mi .2s ease;max-height:90vh;overflow-y:auto}
@keyframes mi{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
#mtit{font-size:.98rem;font-weight:900;margin-bottom:14px}
.fi{margin-bottom:12px}.fi label{display:block;font-size:.72rem;font-weight:700;color:var(--mu);margin-bottom:3px}
.fi input,.fi textarea,.fi select{width:100%;padding:9px 11px;border:1px solid var(--br);border-radius:8px;font-size:.84rem;font-family:inherit;transition:border-color .2s}
.fi input:focus,.fi textarea:focus,.fi select:focus{outline:none;border-color:var(--r)}
.fi textarea{resize:vertical;min-height:80px}
.macts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.bcnc{background:#f3f4f6;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.81rem}
.bsav{background:var(--r);color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.81rem}
.bsav:hover{background:var(--rd)}
#lmod{display:none;position:fixed;inset:0;background:rgba(20,0,60,.65);backdrop-filter:blur(4px);z-index:600;align-items:center;justify-content:center}
#lmod.on{display:flex}
#lbox{background:#fff;border-radius:22px;padding:34px 26px 26px;width:92%;max-width:350px;text-align:center;box-shadow:0 28px 72px rgba(0,0,0,.28);animation:mi .25s ease}
#lbox h2{font-size:1.2rem;font-weight:900;color:var(--tx);margin:10px 0 3px}
#lbox .lsub{font-size:.77rem;color:var(--mu);margin-bottom:20px}
.lbtn{width:100%;background:var(--r);color:#fff;border:none;padding:12px;border-radius:10px;font-size:.87rem;font-weight:700;cursor:pointer;margin-top:4px;transition:background .2s}
.lbtn:hover{background:var(--rd)}
.lskip{margin-top:13px;font-size:.75rem;color:var(--mu);cursor:pointer;background:none;border:none;text-decoration:underline;display:block;width:100%}
.lskip:hover{color:var(--r)}
.lerr{color:#b91c1c;font-size:.72rem;margin-top:6px;min-height:16px;font-weight:600}
#toasts{position:fixed;top:72px;right:14px;z-index:999;width:265px}
.tst{background:#2e1065;color:#fff;padding:10px 14px;border-radius:10px;font-size:.8rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);margin-top:8px;animation:tsti .3s ease,tsto .3s ease 3.7s forwards;display:flex;align-items:center;gap:8px}
@keyframes tsti{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes tsto{to{opacity:0;transform:translateX(40px)}}
</style>
</head>

async function load(){

function chime(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[880,.05],[1100,.2],[1320,.35]].forEach(([f,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;
      const t=ctx.currentTime+d;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+.55);
      o.start(t);o.stop(t+.6);
    });
  }catch{}
}

function t2s(t){if(!t)return 0;const p=t.split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];}
function s2t(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.round(s%60);return h>0?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}

function bdays(){return OPS.filter(o=>o.bday).map(o=>({nombre:o.nombre,fecha:o.bday}));}
function dUntil(fs){const [d,m]=fs.split('/').map(Number);const now=new Date();now.setHours(0,0,0,0);const bd=new Date(now.getFullYear(),m-1,d);if(bd<now)bd.setFullYear(now.getFullYear()+1);return Math.ceil((bd-now)/86400000);}
function bdayFecha(fs){const [d,m]=fs.split('/').map(Number);const now=new Date();now.setHours(0,0,0,0);const bd=new Date(now.getFullYear(),m-1,d);if(bd<now)bd.setFullYear(now.getFullYear()+1);return `${bd.getFullYear()}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function proxCumple(){const l=bdays().sort((a,b)=>dUntil(a.fecha)-dUntil(b.fecha));if(!l.length)return '—';const c=l[0],d=dUntil(c.fecha);return d===0?'¡Hoy! 🎂':`${c.nombre.split(' ')[0]} (${d}d)`;}

function renderKpiTable(){

function renderResumen(el){
  const edTh=sup?'<th></th>':'';

    return `<div class="tc" style="animation-delay:${(i*.28)%2.4}s"><div class="avr"><div class="avc" style="background:${c}">${in2}</div></div><div class="tcnm">${m.nombre}</div><div class="tcrl">${m.rol}</div>${bd}</div>`;
  }).join('');
  document.getElementById('s-eq').innerHTML=`<div class="sh"><h2>👥 <em>El Equipo</em> — Frávega ATC</h2></div><div class="g3">${cards}</div>`;
}

// ——— MODAL ———
function omod(type,id=null){
  mAct=type;mId=id;
  const mt=document.getElementById('mtit'),mb=document.getElementById('mbdy');
  const fi=(lbl,cnt)=>`<div class="fi"><label>${lbl}</label>${cnt}</div>`;
  const ip=(id,ph,tp='text')=>`<input id="${id}" type="${tp}" placeholder="${ph}">`;
  if(type==='nov'){mt.textContent='📢 Nueva Novedad';mb.innerHTML=fi('Título',ip('m1','Título del comunicado'))+fi('Contenido','<textarea id="m2" placeholder="Escribí el comunicado..."></textarea>');}
  else if(type==='ev'){mt.textContent='📅 Nuevo Evento';mb.innerHTML=fi('Título',ip('m1','Nombre del evento'))+fi('Fecha',ip('m2','','date'))+fi('Descripción',ip('m3','Descripción'));}
  else if(type==='kpi-d'){
    const op=OPS.find(o=>o.id===id.opId),dia=SEMANA.find(d=>d.id===id.dia),k=getK(id.opId,id.dia);
    mt.textContent=`✏️ ${op.nombre} — ${dia.short}`;
    mb.innerHTML=fi('📞 Llamadas Conectadas',`<input id="m-ll" type="number" min="0" value="${k?k.ll:''}" placeholder="0">`)+fi('⏱ Back Office / Supervisor (ej: 0:18:48)',`<input id="m-bo" placeholder="0:00:00" value="${k?k.bo:''}">`);
  }
  else if(type==='to-e'){
    const op=OPS.find(o=>o.id===id);
    mt.textContent=`✏️ Time Out semanal — ${op.nombre}`;
    mb.innerHTML=fi('⚠️ Fichas Time Out sin tipificar (total semana)',`<input id="m-to" type="number" min="0" value="${D.to[id]!==undefined?D.to[id]:''}" placeholder="0">`);
  }
  document.getElementById('mov').classList.add('on');
}
function cmod(){document.getElementById('mov').classList.remove('on');mAct=null;mId=null;}

async function smod(){
  const now=new Date();
  const fecha=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
  if(mAct==='nov'){
    const t=gv('m1'),c=gv('m2');if(!t||!c)return alert('Completá todos los campos');
    D.novs.unshift({id:Date.now(),titulo:t,cont:c,fecha});cmod();rNov();rIn();chime();toast('¡Novedad publicada!','📢');sv('novs');
  }else if(mAct==='ev'){
    const t=gv('m1'),f=gv('m2'),d=gv('m3');if(!t||!f)return alert('Completá título y fecha');
    D.evs.push({id:Date.now(),titulo:t,desc:d,fecha:f});cmod();rEv();toast('Evento agregado ✓','📅');sv('evs');
  }else if(mAct==='kpi-d'){
    const ll=parseInt(gv('m-ll'))||0,bo=gv('m-bo')||'0:00:00';
    let rec=D.k2.find(r=>r.opId===mId.opId&&r.dia===mId.dia);
    if(rec){rec.ll=ll;rec.bo=bo;}else D.k2.push({id:Date.now(),opId:mId.opId,dia:mId.dia,bo,ll});
    cmod();renderKpiTable();toast('Métricas guardadas ✓','✅');sv('k2');
  }else if(mAct==='to-e'){
    D.to[mId]=parseInt(gv('m-to'))||0;cmod();renderKpiTable();toast('Time Out actualizado ✓','✅');sv('to');
  }
}

async function dNov(id){if(!confirm('¿Eliminar?'))return;D.novs=D.novs.filter(n=>n.id!==id);await sv('novs');rNov();rIn();}
async function dEv(id){if(!confirm('¿Eliminar?'))return;D.evs=D.evs.filter(e=>e.id!==id);await sv('evs');rEv();}

async function poll(){
  if(sup)return;
  try{const r=await window.storage.get('fjv4:novs',true);const novs=JSON.parse(r.value);
    if(novs.length>lastN&&lastN>0){D.novs=novs;lastN=novs.length;chime();toast('¡Nueva novedad disponible!','📣');const ac=document.querySelector('.sec.on');if(ac)render(ac.id.replace('s-',''));}
    else lastN=novs.length;
  }catch{}
}

async function init(){await load();tick();setInterval(tick,30000);setInterval(poll,5000);rIn();}
init();
</script>
